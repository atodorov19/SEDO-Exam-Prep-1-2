name: .NET

on:
  push:
    branches: [ "feature", "develop" ]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run the tests
      run: dotnet test --no-build --verbosity normal
